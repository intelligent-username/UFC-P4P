<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UFC Pound-For-Pound Rankings</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <h1>Pound-For-Pound Rankings</h1>
  <p>Initial Elo for all fighters: 500</p>

  <fieldset class="filter-container">
    <legend>Filter Rankings</legend>
    <select id="ranking-type">
      <option value="current">Current</option>
      <option value="historical">Historical</option>
    </select>
    <select id="weight-class-filter">
      <option value="all">All</option>
      <!-- Weight class options will be dynamically populated -->
    </select>
  </fieldset>

  <h2 id="ranking-title">Current Rankings</h2>
  <h6 style = "font-weight: normal">*Note: These rankings are based on fight history, not necessarily current skill, state, etc.</h6>
  <table id="ranking-table">
    <thead>
      <tr>
        <th id="rank-header" class="sortable" aria-label="Rank">Rank &#9660;</th>
        <th>Name</th>
        <th>Elo</th>
        <th>Weight Class</th>
      </tr>
    </thead>
    <tbody id="ranking-body">
      <!-- Rows to be dynamically generated here -->
    </tbody>
  </table>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
